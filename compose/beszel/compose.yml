services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    labels:
      wud.trigger.include: docker.beszel
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 1m

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: '${KEY}'
    labels:
      wud.trigger.include: docker.beszel
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep beszel-agent || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - SERVICES=1
      - TASKS=1
      - INFO=1
      - POST=1
    ports:
      - 2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    labels:
      wud.trigger.include: docker.beszel
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2375"]
      interval: 2m
      timeout: 5s
      retries: 3