---
volumes:
  portainer_data:
    driver: local
services:
  vaultwarden:
    image: vaultwarden/server:latest
    environment:
      - SIGNUPS_ALLOWED=false
      - DOMAIN='${VAR_VAULTWARDEN_DOMAIN}'
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - "./vw-data:/data/"
    labels:
      wud.trigger.include: docker.vaultwarden

  beszel-agent:
    image: "henrygd/beszel-agent"
    container_name: "beszel-agent"
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      KEY: '${VAR_BESZEL_KEY}'
    labels:
      wud.trigger.include: docker.vaultwarden

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - SERVICES=1
      - TASKS=1
      - INFO=1
      - POST=1
    ports:
      - 2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    labels:
      wud.trigger.include: docker.vaultwarden
