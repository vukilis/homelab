---
services:
  portainer-agent:
    container_name: portainer-agent
    image: portainer/agent
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    depends_on:
      - uptimekuma
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
      restart_policy:
        condition: unless-stopped
        delay: 5s
        window: 120s
    labels:
      wud.trigger.include: docker.uptimekuma

  uptimekuma:
    image: louislam/uptime-kuma
    container_name: uptimekuma
    volumes:
       - ./uptimekuma-data:/app/data
    ports:
       - 80:3001
    dns:
      - 192.168.0.202
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    labels:
      wud.trigger.include: docker.uptimekuma

  beszel-agent:
    image: "henrygd/beszel-agent"
    container_name: "beszel-agent"
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      KEY: '${VAR_BESZEL_KEY}'
    labels:
      wud.trigger.include: docker.uptimekuma

  wud-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: wud-proxy
    restart: always
    environment:
      - CONTAINERS=1   # Allow WUD to see container list
      - IMAGES=1       # Allow WUD to see image versions
      - INFO=1         # Allow WUD to see Docker host info
      - POST=1         # Disables all "Write" commands
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 2375:2375
    labels:
      wud.trigger.include: docker.uptimekuma
